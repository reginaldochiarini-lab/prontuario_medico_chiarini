<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PsicoCare Alta Performance — Psiquiatria Alopática & Integrativa</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fonte Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            },
            integrative: {
              50: '#ecfdf5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    /* Custom scrollbar suave */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.35);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.6);
    }
    /* Estilo de impressão limpo para a Central de Exportação */
    @media print {
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: #ffffff !important;
        color: #0f172a !important;
        padding: 20px;
      }
    }
    .pulse-red {
      animation: pulseRed 2s infinite;
    }
    @keyframes pulseRed {
      0%, 100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.45); }
      50% { box-shadow: 0 0 0 8px rgba(225, 29, 72, 0); }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased transition-colors duration-200">

  <!-- Container Principal -->
  <div class="flex min-h-screen w-full overflow-x-hidden">

    <!-- Overlay Mobile Sidebar -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-40 hidden lg:hidden"></div>

    <!-- SIDEBAR FIXA (Desktop) / RETRÁTIL (Mobile) -->
    <aside id="sidebar" class="fixed lg:sticky top-0 left-0 z-50 h-screen w-72 shrink-0 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-200 ease-in-out">
      
      <!-- Logo & Header da Sidebar -->
      <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-600 to-emerald-500 flex items-center justify-center text-white font-bold shadow-md shadow-indigo-500/20">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
            </svg>
          </div>
          <div>
            <h1 class="text-sm font-extrabold tracking-tight text-slate-900 dark:text-white leading-tight">PsicoCare <span class="text-indigo-600 dark:text-indigo-400">AP</span></h1>
            <p class="text-[11px] font-medium text-emerald-600 dark:text-emerald-400">Alopática & Integrativa</p>
          </div>
        </div>
        <button onclick="toggleSidebar()" class="lg:hidden p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Gerenciador de Pacientes (LGPD 100% Local) -->
      <div class="p-3 border-b border-slate-200 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-900/50">
        <div class="flex items-center justify-between mb-2">
          <span class="text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Pacientes (Local LGPD)</span>
          <button onclick="openNewPatientModal()" class="text-xs font-semibold px-2.5 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm transition flex items-center gap-1">
            <span>+</span> Novo
          </button>
        </div>
        <div class="relative mb-2">
          <input id="patient-search" type="text" oninput="renderPatientList()" placeholder="Buscar paciente..." class="w-full text-xs pl-8 pr-3 py-1.5 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <svg class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>
        <div id="patient-list" class="max-h-36 overflow-y-auto space-y-1 pr-0.5">
          <!-- Renderizado via JS -->
        </div>
      </div>

      <!-- Menu de Navegação dos Módulos -->
      <nav class="flex-1 overflow-y-auto p-3 space-y-1">
        <p class="px-2.5 pb-1 text-[10px] font-bold uppercase tracking-wider text-slate-400">Módulos Clínicos</p>
        <button onclick="switchTab('dashboard')" data-tab="dashboard" class="nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition">
          <span class="flex items-center gap-2.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v5a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v2a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zM14 12a1 1 0 011-1h4a1 1 0 011 1v7a1 1 0 01-1 1h-4a1 1 0 01-1-1v-7z"/></svg>
            Dashboard & Radar
          </span>
          <span id="sidebar-alert-badge" class="hidden text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-rose-600 text-white">0</span>
        </button>

        <button onclick="switchTab('anamnesis')" data-tab="anamnesis" class="nav-btn w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-medium transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
          Anamnese & Escalas
        </button>

        <button onclick="switchTab('labs')" data-tab="labs" class="nav-btn w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-medium transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
          Exames em Camadas
        </button>

        <button onclick="switchTab('therapy')" data-tab="therapy" class="nav-btn w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-medium transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12c0-1.232-.046-2.453-.138-3.662a4.006 4.006 0 00-3.7-3.7 48.678 48.678 0 00-7.324 0 4.006 4.006 0 00-3.7 3.7c-.017.22-.032.441-.046.662M19.5 12l3-3m-3 3l-3-3m-12 3c0 1.232.046 2.453.138 3.662a4.006 4.006 0 003.7 3.7 48.656 48.656 0 007.324 0 4.006 4.006 0 003.7-3.7c.017-.22.032-.441.046-.662M4.5 12l3 3m-3-3l-3 3"/></svg>
          Decisão Terapêutica
        </button>

        <button onclick="switchTab('longitudinal')" data-tab="longitudinal" class="nav-btn w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-medium transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"/></svg>
          Evolução Longitudinal
        </button>

        <button onclick="switchTab('export')" data-tab="export" class="nav-btn w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-medium transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"/></svg>
          Central de Exportação
        </button>
      </nav>

      <!-- Rodapé da Sidebar: Backup JSON & Tema -->
      <div class="p-3 border-t border-slate-200 dark:border-slate-800 space-y-2">
        <div class="grid grid-cols-2 gap-1.5">
          <button onclick="exportBackupJSON()" class="text-[11px] font-medium px-2 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 transition flex items-center justify-center gap-1" title="Exportar Backup JSON">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            Backup
          </button>
          <label class="cursor-pointer text-[11px] font-medium px-2 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 transition flex items-center justify-center gap-1" title="Importar Backup JSON">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
            Restaurar
            <input type="file" accept=".json" onchange="importBackupJSON(event)" class="hidden" />
          </label>
        </div>
        <button onclick="toggleTheme()" class="w-full text-xs font-medium px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition flex items-center justify-between">
          <span id="theme-label" class="flex items-center gap-2">Modo Claro</span>
          <span id="theme-icon">☀️</span>
        </button>
      </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="flex-1 flex flex-col min-w-0">
      
      <!-- Topbar Responsiva -->
      <header class="sticky top-0 z-30 bg-white/85 dark:bg-slate-900/85 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 lg:px-6 py-3 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div class="min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <h2 id="topbar-patient-name" class="text-base lg:text-lg font-bold truncate">Paciente</h2>
              <span id="topbar-patient-meta" class="text-xs px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-medium"></span>
            </div>
            <p id="topbar-patient-dx" class="text-xs text-slate-500 dark:text-slate-400 truncate"></p>
          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <div id="topbar-status-pill" onclick="switchTab('dashboard')" class="cursor-pointer hidden sm:flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-full transition">
            <!-- Status dinâmico de alertas -->
          </div>
          <button onclick="switchTab('export')" class="text-xs font-semibold px-3 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm transition flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            <span class="hidden sm:inline">Exportar</span>
          </button>
        </div>
      </header>

      <!-- Área Dinâmica das Abas -->
      <main id="main-content" class="flex-1 p-4 lg:p-6 max-w-7xl w-full mx-auto space-y-6">
        <!-- Renderizado dinamicamente conforme a aba ativa -->
      </main>
    </div>
  </div>

  <!-- Área Oculta para Impressão / PDF -->
  <div id="print-area" class="hidden"></div>

  <!-- MODAL: Novo Paciente -->
  <div id="modal-new-patient" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/70 backdrop-blur-sm p-4">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold">Novo Paciente</h3>
        <button onclick="closeNewPatientModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">✕</button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold mb-1 text-slate-600 dark:text-slate-400">Nome Completo *</label>
          <input id="np-name" type="text" placeholder="Ex: Carlos Eduardo Souza" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold mb-1 text-slate-600 dark:text-slate-400">Idade</label>
            <input id="np-age" type="number" value="35" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1 text-slate-600 dark:text-slate-400">Sexo</label>
            <select id="np-sex" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm outline-none">
              <option value="F">Feminino</option>
              <option value="M">Masculino</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold mb-1 text-slate-600 dark:text-slate-400">Peso (kg)</label>
            <input id="np-weight" type="number" step="0.1" value="70" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1 text-slate-600 dark:text-slate-400">Altura (cm)</label>
            <input id="np-height" type="number" value="170" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm outline-none" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1 text-slate-600 dark:text-slate-400">Hipóteses Diagnósticas</label>
          <input id="np-dx" type="text" placeholder="Ex: TAG, Episódio Depressivo Moderado" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm outline-none" />
        </div>
      </div>
      <div class="mt-6 flex justify-end gap-2">
        <button onclick="closeNewPatientModal()" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700">Cancelar</button>
        <button onclick="createNewPatient()" class="px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm">Criar Paciente</button>
      </div>
    </div>
  </div>

  <!-- MODAL: Confirmação Genérica (substitui confirm()) -->
  <div id="modal-confirm" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/70 backdrop-blur-sm p-4">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl">
      <h3 id="confirm-title" class="text-base font-bold mb-2">Confirmar Ação</h3>
      <p id="confirm-message" class="text-sm text-slate-600 dark:text-slate-400 mb-5"></p>
      <div class="flex justify-end gap-2">
        <button onclick="closeConfirmModal()" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-100 dark:bg-slate-800">Cancelar</button>
        <button id="confirm-ok-btn" class="px-4 py-2 rounded-xl text-sm font-semibold bg-rose-600 hover:bg-rose-700 text-white">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- SCRIPT PRINCIPAL -->
  <script>
    /*************************************************************************
     * 1. BASES DE CONHECIMENTO CLÍNICO (FARMACOLOGIA, EXAMES, ESCALAS, INTEGRATIVA)
     *************************************************************************/

    const STORAGE_KEY = 'psicocare_ap_patients_v1';

    // Biblioteca de Psicofármacos Alopáticos
    const PSYCHOPHARM_LIBRARY = [
      // ISRS
      { name: 'Escitalopram', cls: 'ISRS', doses: '10mg a 20mg', posology: '1 cp pela manhã', tags: ['serotonin', 'qtc'] },
      { name: 'Sertralina', cls: 'ISRS', doses: '50mg a 200mg', posology: '1 cp pela manhã após café', tags: ['serotonin'] },
      { name: 'Fluoxetina', cls: 'ISRS', doses: '20mg a 60mg', posology: '1 cp pela manhã', tags: ['serotonin', 'cyp2d6'] },
      { name: 'Paroxetina', cls: 'ISRS', doses: '20mg a 40mg', posology: '1 cp pela manhã ou noite', tags: ['serotonin', 'cyp2d6'] },
      { name: 'Citalopram', cls: 'ISRS', doses: '20mg a 40mg', posology: '1 cp pela manhã', tags: ['serotonin', 'qtc'] },
      { name: 'Fluvoxamina', cls: 'ISRS', doses: '50mg a 300mg', posology: '1 cp à noite', tags: ['serotonin', 'cyp1a2'] },
      // IRSN
      { name: 'Desvenlafaxina', cls: 'IRSN', doses: '50mg a 100mg', posology: '1 cp pela manhã', tags: ['serotonin'] },
      { name: 'Venlafaxina XR', cls: 'IRSN', doses: '75mg a 225mg', posology: '1 cp pela manhã com alimento', tags: ['serotonin'] },
      { name: 'Duloxetina', cls: 'IRSN', doses: '30mg a 120mg', posology: '1 cp pela manhã', tags: ['serotonin'] },
      // Atípicos & Outros Antidepressivos
      { name: 'Bupropiona XL', cls: 'Atípico (NDRI)', doses: '150mg a 300mg', posology: '1 cp pela manhã', tags: ['cyp2d6'] },
      { name: 'Trazodona', cls: 'Atípico (SARI)', doses: '50mg a 150mg', posology: '1 cp 1h antes de dormir', tags: ['serotonin'] },
      { name: 'Mirtazapina', cls: 'Atípico (NaSSA)', doses: '15mg a 45mg', posology: '1 cp ao deitar', tags: ['serotonin', 'metabolic'] },
      { name: 'Vortioxetina', cls: 'Multimodal', doses: '10mg a 20mg', posology: '1 cp pela manhã', tags: ['serotonin'] },
      { name: 'Amitriptilina', cls: 'Tricíclico', doses: '25mg a 150mg', posology: '1 cp à noite', tags: ['serotonin', 'qtc'] },

    function calcBMI(weight, heightCm) {
      const w = parseFloat(weight);
      const h = parseFloat(heightCm) / 100;
      if (!w || !h || h <= 0) return { val: '--', label: 'N/A', color: 'slate' };
      const bmi = w / (h * h);
      let label = 'Eutrofia', color = 'emerald';
      if (bmi < 18.5) { label = 'Baixo Peso'; color = 'amber'; }
      else if (bmi >= 25 && bmi < 30) { label = 'Sobrepeso'; color = 'amber'; }
      else if (bmi >= 30 && bmi < 35) { label = 'Obesidade I'; color = 'rose'; }
      else if (bmi >= 35) { label = 'Obesidade II/III'; color = 'rose'; }
      return { val: bmi.toFixed(1), label, color };
    }

    function calcHOMAIR(glucose, insulin) {
      const g = parseFloat(glucose);
      const i = parseFloat(insulin);
      if (!g || !i) return null;
      return (g * i) / 405;
    }

    function calcQTcBazett(qtMs, hrBpm) {
      const qt = parseFloat(qtMs);
      const hr = parseFloat(hrBpm);
      if (!qt || !hr || hr <= 0) return null;
      const rrSec = 60 / hr;
      return qt / Math.sqrt(rrSec);
    }

    function getScaleTotals(p) {
      const phq9 = (p.scales?.phq9 || []).reduce((a, b) => a + Number(b || 0), 0);
      const gad7 = (p.scales?.gad7 || []).reduce((a, b) => a + Number(b || 0), 0);
      const isi  = (p.scales?.isi  || []).reduce((a, b) => a + Number(b || 0), 0);
      const mdq  = (p.scales?.mdq  || []).filter(Boolean).length;
      const asrs = (p.scales?.asrs || []).reduce((a, b) => a + Number(b || 0), 0);
      const asrsPos = (p.scales?.asrs || []).filter((v, idx) => (idx < 3 ? v >= 2 : v >= 3)).length;
      return { phq9, gad7, isi, mdq, asrs, asrsPos };
    }

    function classifyPHQ9(s) {
      if (s <= 4) return { label: 'Mínima', color: 'emerald' };
      if (s <= 9) return { label: 'Leve', color: 'amber' };
      if (s <= 14) return { label: 'Moderada', color: 'amber' };
      if (s <= 19) return { label: 'Moderadamente Grave', color: 'rose' };
      return { label: 'Grave', color: 'rose' };
    }

    function classifyGAD7(s) {
      if (s <= 4) return { label: 'Mínima', color: 'emerald' };
      if (s <= 9) return { label: 'Leve', color: 'amber' };
      if (s <= 14) return { label: 'Moderada', color: 'amber' };
      return { label: 'Grave', color: 'rose' };
    }

    function classifyISI(s) {
      if (s <= 7) return { label: 'Sem Insônia', color: 'emerald' };
      if (s <= 14) return { label: 'Sublimiar', color: 'amber' };
      if (s <= 21) return { label: 'Moderada', color: 'rose' };
      return { label: 'Grave', color: 'rose' };
    }

    /**
     * Radar de Segurança e Inteligência Clínica Automática
     * Analisa medicações em uso, prescrições ativas, integrativa (CBD), Red Flags e Escalas
     */
    function computeClinicalAlerts(p) {
      const alerts = [];

      // Consolidar todos os fármacos (em uso + prescritos que não sejam apenas texto vazio)
      const allMedNames = new Set([
        ...(p.currentMeds || []),
        ...(p.therapy?.allopathic || []).map(m => m.name)
      ]);
      const medList = Array.from(allMedNames);
      const medListLower = medList.map(m => m.toLowerCase());

      // Verificar presença de CBD nos protocolos integrativos
      const hasCBD = (p.therapy?.integrative || []).some(f =>
        f.title.toLowerCase().includes('cbd') ||
        f.title.toLowerCase().includes('canabidiol') ||
        (f.actives || []).some(a => a.name.toLowerCase().includes('canabidiol') || a.name.toLowerCase().includes('cbd'))
      );

      // 1. SINAIS DE ALARME (RED FLAGS)
      const rf = p.redFlags || {};
      const activeRFs = [];
      if (rf.suicidalIdeation) activeRFs.push('Ideação Suicida');
      if (rf.psychosis) activeRFs.push('Sintomas Psicóticos');
      if (rf.mania) activeRFs.push('Virada Maníaca / Hipomania');
      if (rf.agitation) activeRFs.push('Agitação Psicomotora');
      if ((p.scales?.phq9?.[8] || 0) > 0 && !rf.suicidalIdeation) {
        activeRFs.push('Item 9 do PHQ-9 positivo (pensamentos de morte/autoagressão)');
      }

      if (activeRFs.length > 0) {
        alerts.push({
          severity: 'critical',
          title: 'RED FLAG PSIQUIÁTRICO ATIVO',
          desc: `Sinais detectados: ${activeRFs.join(', ')}. Avaliar estratificação de risco imediata, rede de apoio, plano de segurança e necessidade de manejo intensivo/urgência.`,
          tags: activeRFs
        });
      }

      // 2. RISCO METABÓLICO OCULTO
      const metabolicDrugs = ['olanzapina', 'quetiapina', 'risperidona', 'clozapina', 'ácido valproico', 'divalproato', 'valproico'];
      const foundMetabolic = medList.filter(m => metabolicDrugs.some(md => m.toLowerCase().includes(md)));
      if (foundMetabolic.length > 0) {
        alerts.push({
          severity: 'high',
          title: 'Alerta de Risco Metabólico Oculto',
          desc: `Uso/prescrição de ${foundMetabolic.join(', ')}. Rastreio obrigatório recomendado: HOMA-IR (Glicemia + Insulina), Triglicerídeos, HbA1c, Perfil Lipídico e Enzimas Hepáticas (TGO/TGP/GGT).`,
          tags: foundMetabolic
        });
      }

      // 3. SÍNDROME SEROTONINÉRGICA
      const seroKeywords = ['escitalopram', 'sertralina', 'fluoxetina', 'paroxetina', 'citalopram', 'fluvoxamina', 'desvenlafaxina', 'venlafaxina', 'duloxetina', 'trazodona', 'mirtazapina', 'vortioxetina', 'amitriptilina', 'nortriptilina', 'clomipramina', 'lítio', 'tramadol', 'triptano', 'sumatriptana'];
      const foundSero = medList.filter(m => seroKeywords.some(sk => m.toLowerCase().includes(sk)));
      if (foundSero.length >= 2) {
        alerts.push({
          severity: 'high',
          title: 'Risco de Síndrome Serotoninérgica',
          desc: `Associação de ${foundSero.length} agentes serotoninérgicos (${foundSero.join(' + ')}). Monitorar clônus, hiperreflexia, diaforese, tremor, agitação e hipertermia; ajustar doses com cautela.`,
          tags: foundSero
        });
      }

      // 4. PROLONGAMENTO DE INTERVALO QTc
      const qtcKeywords = ['citalopram', 'escitalopram', 'haloperidol', 'quetiapina', 'ziprasidona', 'amitriptilina', 'nortriptilina', 'clomipramina', 'lítio', 'clozapina'];
      const foundQTc = medList.filter(m => qtcKeywords.some(qk => m.toLowerCase().includes(qk)));
      if (foundQTc.length > 0) {
        const qtcVal = calcQTcBazett(p.labs?.values?.qt, p.labs?.values?.hr);
        const qtcExtra = qtcVal ? ` QTc atual calculado: ${Math.round(qtcVal)} ms.` : ' Solicitar ECG basal (Camada 4) e eletrólitos (K+/Mg2+).';
        alerts.push({
          severity: foundQTc.length >= 2 || (qtcVal && qtcVal > 470) ? 'high' : 'warning',
          title: 'Atenção: Prolongamento de Intervalo QTc',
          desc: `Agente(s) com potencial de alargar QTc: ${foundQTc.join(', ')}.${qtcExtra}`,
          tags: foundQTc
        });
      }

      // 5. INTERAÇÃO CYP450
      const cypFindings = [];
      if (medListLower.some(m => m.includes('fluoxetina') || m.includes('paroxetina') || m.includes('bupropiona'))) {
        cypFindings.push('Inibidor potente CYP2D6 (Fluoxetina/Paroxetina/Bupropiona)');
      }
      if (medListLower.some(m => m.includes('fluvoxamina'))) {
        cypFindings.push('Inibidor potente CYP1A2/2C19 (Fluvoxamina)');
      }
      if (medListLower.some(m => m.includes('carbamazepina'))) {
        cypFindings.push('Indutor potente CYP3A4/1A2 (Carbamazepina — reduz nível sérico de outros fármacos)');
      }
      if (hasCBD) {
        cypFindings.push('Canabidiol (CBD) — inibidor CYP3A4 e CYP2C19 (atenção a Clobazam, BZD, ISRS e Antipsicóticos)');
      }
      if (cypFindings.length > 0) {
        alerts.push({
          severity: 'warning',
          title: 'Alerta de Interação Enzimática CYP450',
          desc: cypFindings.join(' | '),
          tags: ['CYP450']
        });
      }

      // 6. RASTREIO DE BIPOLARIDADE (MDQ) + ANTIDEPRESSIVO SEM ESTABILIZADOR
      const scales = getScaleTotals(p);
      const hasMoodStab = medListLower.some(m => ['lítio', 'valproico', 'divalproato', 'lamotrigina', 'carbamazepina', 'quetiapina', 'olanzapina', 'aripiprazol', 'risperidona'].some(ms => m.includes(ms)));
      const hasAntidepressant = medListLower.some(m => ['escitalopram', 'sertralina', 'fluoxetina', 'paroxetina', 'citalopram', 'fluvoxamina', 'desvenlafaxina', 'venlafaxina', 'duloxetina', 'amitriptilina', 'bupropiona'].some(ad => m.includes(ad)));
      if (scales.mdq >= 3 && hasAntidepressant && !hasMoodStab) {
        alerts.push({
          severity: 'critical',
          title: 'Risco de Virada Maníaca (MDQ Positivo)',
          desc: `Rastreio MDQ positivo (${scales.mdq}/5) com uso de antidepressivo sem estabilizador de humor associado. Reavaliar espectro bipolar antes de manter monoterapia antidepressiva.`,
          tags: ['Espectro Bipolar']
        });
      }

      return alerts;
    }

    // Avalia se um exame laboratorial está fora da faixa ótima funcional
    function getFunctionalLabStatus(key, rawVal) {
      const v = parseFloat(rawVal);
      if (isNaN(v)) return null;
      const rules = {
        ferritin:     { ok: v >= 50 && v <= 250, msg: v < 50 ? 'Baixa (< 50 ng/mL — risco fadiga/dopamina)' : 'Elevada (> 250 — investigar inflamação)' },
        b12:          { ok: v >= 500, msg: 'Subótima (< 500 pg/mL — faixa ótima psiquiátrica ≥ 500)' },
        vitD:         { ok: v >= 40 && v <= 80, msg: v < 40 ? 'Insuficiente (< 40 ng/mL)' : 'Elevada (> 80 ng/mL)' },
        homocysteine: { ok: v <= 10, msg: 'Elevada (> 10 µmol/L — atenção metilação/risco vascular)' },
        tsh:          { ok: v >= 0.5 && v <= 2.5, msg: v > 2.5 ? 'Acima da faixa ótima (> 2.5 mUI/L)' : 'Suprimido (< 0.5)' },
        hba1c:        { ok: v < 5.7, msg: 'Atenção glicêmica (≥ 5.7% — pré-diabetes/RI)' },
        tg:           { ok: v < 150, msg: 'Elevado (≥ 150 mg/dL — risco metabólico)' },
        pcr:          { ok: v <= 1.0, msg: 'Inflamação subclínica (> 1.0 mg/L)' }
      };
      if (!rules[key]) return null;
      return rules[key].ok ? { status: 'ok', msg: 'Faixa ótima' } : { status: 'alert', msg: rules[key].msg };
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bg = type === 'error' ? 'bg-rose-600' : type === 'info' ? 'bg-indigo-600' : 'bg-emerald-600';
      toast.className = `${bg} text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-lg flex items-center gap-2 pointer-events-auto transition-all duration-300 translate-y-2 opacity-0`;
      toast.innerHTML = `<span>${type === 'error' ? '⚠️' : '✓'}</span><span>${message}</span>`;
      container.appendChild(toast);
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2800);
    }

      e.stopPropagation();
      if (patients.length <= 1) {
        showToast('Mantenha ao menos 1 paciente cadastrado.', 'error');
        return;
      }
      const pat = patients.find(p => p.id === id);
      openConfirmModal('Excluir Paciente', `Deseja remover "${pat?.name}" do armazenamento local? Esta ação não pode ser desfeita.`, () => {
        patients = patients.filter(p => p.id !== id);
        if (activePatientId === id) activePatientId = patients[0].id;
        saveState();
        renderAll();
        showToast('Paciente removido.');
      });
    }

    // Backup & Restore JSON (LGPD 100% Local)
    function exportBackupJSON() {
      const dataStr = JSON.stringify(patients, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `PsicoCare_Backup_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Backup JSON exportado com sucesso!');
    }

    function importBackupJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!Array.isArray(parsed) || parsed.length === 0) throw new Error('Formato inválido');
          patients = parsed;
          activePatientId = patients[0].id;
          saveState();
          renderAll();
          showToast(`${patients.length} paciente(s) restaurado(s)!`);
        } catch (err) {
          showToast('Arquivo JSON inválido.', 'error');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // Cópia segura para Clipboard (compatível com iFrame via execCommand)
    function copyTextToClipboard(text, btnElement) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        if (btnElement) {
          const orig = btnElement.innerHTML;
          btnElement.innerHTML = '✓ Copiado!';
          btnElement.classList.add('bg-emerald-600', 'text-white');
          setTimeout(() => {
            btnElement.innerHTML = orig;
            btnElement.classList.remove('bg-emerald-600', 'text-white');
          }, 1800);
        }
        showToast('Texto copiado para a área de transferência!');
      } catch (err) {
        showToast('Não foi possível copiar automaticamente.', 'error');
      }
      document.body.removeChild(ta);
    }

      renderTopbarAndBadges();
      updateNavHighlight();

      const main = document.getElementById('main-content');
      const p = getActivePatient();

      if (activeTab === 'dashboard') main.innerHTML = renderDashboard(p);
      else if (activeTab === 'anamnesis') main.innerHTML = renderAnamnesisAndScales(p);
      else if (activeTab === 'labs') main.innerHTML = renderLabsModule(p);
      else if (activeTab === 'therapy') main.innerHTML = renderTherapyModule(p);
      else if (activeTab === 'longitudinal') main.innerHTML = renderLongitudinalModule(p);
      else if (activeTab === 'export') main.innerHTML = renderExportModule(p);
    }

    function renderPatientList() {
      const q = (document.getElementById('patient-search')?.value || '').toLowerCase();
      const list = document.getElementById('patient-list');
      const filtered = patients.filter(p => p.name.toLowerCase().includes(q) || (p.diagnoses || '').toLowerCase().includes(q));
      list.innerHTML = filtered.map(p => {
        const isActive = p.id === activePatientId;
        const alertCount = computeClinicalAlerts(p).length;
        return `
          <div onclick="selectPatient('${p.id}')" class="group cursor-pointer flex items-center justify-between px-2.5 py-2 rounded-xl text-xs transition ${isActive ? 'bg-indigo-600 text-white shadow-sm' : 'hover:bg-slate-200/70 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300'}">
            <div class="min-w-0 pr-2">
              <div class="font-semibold truncate">${p.name}</div>
              <div class="text-[10px] truncate ${isActive ? 'text-indigo-100' : 'text-slate-400'}">${p.age}a • ${p.sex} • ${p.currentMeds.length} med(s)</div>
            </div>
            <div class="flex items-center gap-1 shrink-0">
              ${alertCount > 0 ? `<span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full ${isActive ? 'bg-white/20 text-white' : 'bg-rose-500/15 text-rose-500'}">${alertCount}</span>` : ''}
              <button onclick="deletePatient('${p.id}', event)" title="Excluir paciente" class="opacity-0 group-hover:opacity-100 p-1 rounded hover:bg-rose-500 hover:text-white transition">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderTopbarAndBadges() {
      const p = getActivePatient();
      const bmi = calcBMI(p.weight, p.height);
      const alerts = computeClinicalAlerts(p);

      document.getElementById('topbar-patient-name').textContent = p.name;
      document.getElementById('topbar-patient-meta').textContent = `${p.age}a • ${p.sex} • IMC ${bmi.val}`;
      document.getElementById('topbar-patient-dx').textContent = p.diagnoses || 'Sem diagnóstico registrado';

      // Sidebar badge
      const sbBadge = document.getElementById('sidebar-alert-badge');
      if (alerts.length > 0) {
        sbBadge.textContent = alerts.length;
        sbBadge.classList.remove('hidden');
      } else {
        sbBadge.classList.add('hidden');
      }

      // Topbar status pill
      const pill = document.getElementById('topbar-status-pill');
      const hasCritical = alerts.some(a => a.severity === 'critical');
      if (alerts.length === 0) {
        pill.className = 'cursor-pointer hidden sm:flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-full bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20';
        pill.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> Radar Limpo`;
      } else if (hasCritical) {
        pill.className = 'cursor-pointer hidden sm:flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-full bg-rose-600 text-white pulse-red';
        pill.innerHTML = `<span class="w-2 h-2 rounded-full bg-white"></span> ${alerts.length} Alerta(s) Crítico(s)`;
      } else {
        pill.className = 'cursor-pointer hidden sm:flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-full bg-amber-500/15 text-amber-600 dark:text-amber-400 border border-amber-500/30';
        pill.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500"></span> ${alerts.length} Alerta(s) Clínico(s)`;
      }
    }

    function updateNavHighlight() {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isCurrent = btn.dataset.tab === activeTab;
        if (isCurrent) {
          btn.className = 'nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-semibold bg-indigo-50 text-indigo-700 dark:bg-indigo-500/15 dark:text-indigo-300 transition';
        } else {
          btn.className = 'nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/70 transition';
        }
      });
    }

    /*************************************************************************
     * MÓDULO 1: DASHBOARD & RADAR CLÍNICO
     *************************************************************************/
    function renderDashboard(p) {
      const bmi = calcBMI(p.weight, p.height);
      const alerts = computeClinicalAlerts(p);
      const totals = getScaleTotals(p);
      const phqCls = classifyPHQ9(totals.phq9);
      const gadCls = classifyGAD7(totals.gad7);
      const isiCls = classifyISI(totals.isi);
      const homa = calcHOMAIR(p.labs?.values?.glucose, p.labs?.values?.insulin);

      const quickMedOptions = PSYCHOPHARM_LIBRARY.map(m => `<option value="${m.name}">${m.name} (${m.cls})</option>`).join('');

      return `
        <!-- KPIs Rápidos -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 lg:gap-4">
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm">
            <div class="text-xs font-medium text-slate-500 dark:text-slate-400">PHQ-9 (Depressão)</div>
            <div class="mt-1 flex items-baseline gap-2">
              <span class="text-2xl font-extrabold">${totals.phq9}</span>
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-${phqCls.color}-500/15 text-${phqCls.color}-600 dark:text-${phqCls.color}-400">${phqCls.label}</span>
            </div>
          </div>
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm">
            <div class="text-xs font-medium text-slate-500 dark:text-slate-400">GAD-7 (Ansiedade)</div>
            <div class="mt-1 flex items-baseline gap-2">
              <span class="text-2xl font-extrabold">${totals.gad7}</span>
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-${gadCls.color}-500/15 text-${gadCls.color}-600 dark:text-${gadCls.color}-400">${gadCls.label}</span>
            </div>
          </div>
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm">
            <div class="text-xs font-medium text-slate-500 dark:text-slate-400">ISI (Insônia)</div>
            <div class="mt-1 flex items-baseline gap-2">
              <span class="text-2xl font-extrabold">${totals.isi}</span>
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-${isiCls.color}-500/15 text-${isiCls.color}-600 dark:text-${isiCls.color}-400">${isiCls.label}</span>
            </div>
          </div>
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm">
            <div class="text-xs font-medium text-slate-500 dark:text-slate-400">Metabólico (IMC / HOMA-IR)</div>
            <div class="mt-1 flex items-baseline gap-2 flex-wrap">
              <span class="text-2xl font-extrabold">${bmi.val}</span>
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-${bmi.color}-500/15 text-${bmi.color}-600 dark:text-${bmi.color}-400">${bmi.label}</span>
              ${homa ? `<span class="text-xs font-semibold ${homa > 2.5 ? 'text-rose-500' : 'text-emerald-500'}">HOMA: ${homa.toFixed(2)}</span>` : ''}
            </div>
          </div>
        </div>

        <!-- RADAR DE SEGURANÇA & INTELIGÊNCIA CLÍNICA -->
        <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-xl bg-rose-500/15 text-rose-500 flex items-center justify-center">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
              </div>
              <div>
                <h3 class="text-base font-bold">Radar de Segurança & Inteligência Clínica</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400">Atualizado em tempo real conforme medicações em uso, prescrições, CBD e escalas.</p>
              </div>
            </div>
            <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${alerts.length ? 'bg-rose-500/15 text-rose-500' : 'bg-emerald-500/15 text-emerald-500'}">
              ${alerts.length} alerta(s) ativo(s)
            </span>
          </div>

          <!-- Rastreio Rápido de Red Flags -->
          <div class="mb-4 p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/70">
            <div class="text-xs font-bold uppercase tracking-wider text-rose-600 dark:text-rose-400 mb-2.5">Rastreio Rápido de Sinais de Alarme (Red Flags)</div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5">
              ${[
                { k: 'suicidalIdeation', label: 'Ideação Suicida' },
                { k: 'psychosis', label: 'Sintomas Psicóticos' },
                { k: 'mania', label: 'Virada Maníaca / Hipomania' },
                { k: 'agitation', label: 'Agitação Psicomotora' }
              ].map(item => `
                <label class="cursor-pointer flex items-center gap-2.5 p-2.5 rounded-xl border transition ${p.redFlags[item.k] ? 'bg-rose-600 text-white border-rose-600 shadow-sm' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 hover:border-rose-400'}">
                  <input type="checkbox" ${p.redFlags[item.k] ? 'checked' : ''} onchange="toggleRedFlag('${item.k}', this.checked)" class="w-4 h-4 accent-rose-600 rounded" />
                  <span class="text-xs font-semibold">${item.label}</span>
                </label>
              `).join('')}
            </div>
          </div>

          <!-- Cards de Alertas Gerados -->
          ${alerts.length === 0 ? `
            <div class="p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-700 dark:text-emerald-300 text-sm flex items-center gap-3">
              <span class="text-lg">🛡️</span>
              <div>
                <div class="font-bold">Nenhum alerta farmacológico ou red flag detectado.</div>
                <div class="text-xs opacity-80">Adicione medicações em uso ou prescrições para ativar o cruzamento automático de segurança.</div>
              </div>
            </div>
          ` : `
            <div class="space-y-2.5">
              ${alerts.map(a => {
                const styles = a.severity === 'critical'
                  ? 'bg-rose-600/10 dark:bg-rose-950/50 border-rose-500 text-rose-800 dark:text-rose-200'
                  : a.severity === 'high'
                  ? 'bg-amber-500/10 dark:bg-amber-950/40 border-amber-500 text-amber-900 dark:text-amber-200'
                  : 'bg-indigo-500/10 dark:bg-indigo-950/40 border-indigo-400 text-indigo-900 dark:text-indigo-200';
                const badge = a.severity === 'critical' ? 'CRÍTICO' : a.severity === 'high' ? 'ALTO RISCO' : 'ATENÇÃO';
                const badgeCls = a.severity === 'critical' ? 'bg-rose-600 text-white' : a.severity === 'high' ? 'bg-amber-500 text-slate-950' : 'bg-indigo-600 text-white';
                return `
                  <div class="p-3.5 rounded-xl border-l-4 ${styles}">
                    <div class="flex items-center justify-between gap-2 mb-1">
                      <span class="text-sm font-bold">${a.title}</span>
                      <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full ${badgeCls}">${badge}</span>
                    </div>
                    <p class="text-xs leading-relaxed opacity-90">${a.desc}</p>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </section>

        <!-- DADOS DEMOGRÁFICOS & PSICOFÁRMACOS EM USO ATUAL -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- Dados Demográficos -->
          <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm space-y-4">
            <h3 class="text-base font-bold flex items-center gap-2">
              <span class="w-2 h-5 rounded-full bg-indigo-600"></span> Dados Demográficos & Diagnósticos
            </h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div class="sm:col-span-2">
                <label class="block text-xs font-semibold text-slate-500 mb-1">Nome Completo</label>
                <input type="text" value="${escapeHtml(p.name)}" onchange="updatePatientField('name', this.value)" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm outline-none focus:ring-2 focus:ring-indigo-500" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Idade</label>
                <input type="number" value="${p.age}" onchange="updatePatientField('age', Number(this.value))" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm outline-none" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Sexo</label>
                <select onchange="updatePatientField('sex', this.value)" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm outline-none">
                  <option value="F" ${p.sex === 'F' ? 'selected' : ''}>Feminino</option>
                  <option value="M" ${p.sex === 'M' ? 'selected' : ''}>Masculino</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Peso (kg)</label>
                <input type="number" step="0.1" value="${p.weight}" onchange="updatePatientField('weight', Number(this.value))" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm outline-none" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Altura (cm)</label>
                <input type="number" value="${p.height}" onchange="updatePatientField('height', Number(this.value))" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm outline-none" />
              </div>
              <div class="sm:col-span-2">
                <label class="block text-xs font-semibold text-slate-500 mb-1">Diagnósticos Sindrômicos Principais (CID-10 / DSM-5-TR)</label>
                <textarea rows="2" onchange="updatePatientField('diagnoses', this.value)" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm outline-none focus:ring-2 focus:ring-indigo-500">${escapeHtml(p.diagnoses)}</textarea>
              </div>
            </div>
          </section>

          <!-- Psicofármacos em Uso Atual -->
          <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm flex flex-col justify-between space-y-4">
            <div>
              <h3 class="text-base font-bold flex items-center gap-2 mb-1">
                <span class="w-2 h-5 rounded-full bg-emerald-500"></span> Psicofármacos em Uso Atual
              </h3>
              <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">Adicione medicações que o paciente já utiliza para disparar o Radar de Segurança.</p>

              <div class="flex gap-2 mb-4">
                <select id="add-current-med-select" class="flex-1 px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm outline-none">
                  <option value="">Selecionar fármaco...</option>
                  ${quickMedOptions}
                </select>
                <button onclick="addCurrentMed()" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold shadow-sm transition">+ Adicionar</button>
              </div>

              <div class="flex flex-wrap gap-2">
                ${p.currentMeds.length === 0 ? '<p class="text-xs text-slate-400 italic">Nenhum psicofármaco em uso registrado.</p>' : p.currentMeds.map(m => `
                  <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-indigo-500/10 text-indigo-700 dark:text-indigo-300 border border-indigo-500/20 text-xs font-semibold">
                    💊 ${escapeHtml(m)}
                    <button onclick="removeCurrentMed('${escapeHtml(m)}')" class="ml-1 text-indigo-400 hover:text-rose-500 font-bold">✕</button>
                  </span>
                `).join('')}
              </div>
            </div>

            <div class="pt-3 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between text-xs text-slate-500">
              <span>Prescrições ativas no plano: <strong>${p.therapy.allopathic.length} alopática(s)</strong> • <strong>${p.therapy.integrative.length} integrativa(s)</strong></span>
              <button onclick="switchTab('therapy')" class="text-indigo-600 dark:text-indigo-400 font-semibold hover:underline">Abrir Conduta →</button>
            </div>
          </section>
        </div>
      `;
    }

    function updatePatientField(field, value) {
      const p = getActivePatient();
      p[field] = value;
      saveState();
      renderAll();
    }

    function toggleRedFlag(key, checked) {
      const p = getActivePatient();
      p.redFlags[key] = checked;
      saveState();
      renderAll();
    }

    function addCurrentMed() {
      const sel = document.getElementById('add-current-med-select');
      const val = sel.value;
      if (!val) return;
      const p = getActivePatient();
      if (!p.currentMeds.includes(val)) {
        p.currentMeds.push(val);
        saveState();
        renderAll();
        showToast(`${val} adicionado ao uso atual.`);
      }
    }

    function removeCurrentMed(name) {
      const p = getActivePatient();
      p.currentMeds = p.currentMeds.filter(m => m !== name);
      saveState();
      renderAll();
    }

    /*************************************************************************
     * MÓDULO 2: ANAMNESE ESTRUTURADA & ESCALAS PSICOMÉTRICAS
     *************************************************************************/
    function renderAnamnesisAndScales(p) {
      const totals = getScaleTotals(p);
      const phqCls = classifyPHQ9(totals.phq9);
      const gadCls = classifyGAD7(totals.gad7);
      const isiCls = classifyISI(totals.isi);

      return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <h2 class="text-xl font-extrabold">Anamnese Estruturada & Escalas Psicométricas</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400">Avaliação biopsicossocial integrativa e instrumentos quantitativos validados.</p>
          </div>
          <button onclick="saveEvaluationToTimeline()" class="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-sm transition flex items-center gap-2 self-start sm:self-auto">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
            Salvar Avaliação na Linha do Tempo
          </button>
        </div>

        <!-- ANAMNESE EM SEÇÕES COLAPSÁVEIS -->
        <section class="space-y-3">
          ${[
            { key: 'qpHda', title: '1. Queixa Principal & História da Doença Atual (HDA)', placeholder: 'Descreva início, evolução, fatores precipitantes, gravidade e impacto funcional...', open: true },
            { key: 'prevMeds', title: '2. Histórico de Psicofármacos Prévios (Eficácia & Efeitos Colaterais)', placeholder: 'Quais fármacos funcionaram? Houve embotamento afetivo, ganho de peso, disfunção sexual ou virada maníaca?', open: false },
            { key: 'sleepCircadian', title: '3. Sono & Ritmo Circadiano', placeholder: 'Horário de deitar/acordar, latência, despertares, exposição à luz solar, telas, cafeína...', open: false },
            { key: 'gutBrain', title: '4. Eixo Intestino-Cérebro & Padrão Alimentar', placeholder: 'Hábito intestinal (Bristol), distensão, sinais de disbiose, consumo de ultraprocessados/açúcares...', open: false },
            { key: 'stressHabits', title: '5. Estresse, Burnout & Hábitos de Vida', placeholder: 'Carga laboral, exercício físico, álcool, cafeína, nicotina, rede de apoio e psicoterapia...', open: false }
          ].map(sec => `
            <details ${sec.open ? 'open' : ''} class="group bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm overflow-hidden">
              <summary class="cursor-pointer list-none px-5 py-3.5 flex items-center justify-between font-semibold text-sm hover:bg-slate-50 dark:hover:bg-slate-800/50 transition">
                <span>${sec.title}</span>
                <span class="text-slate-400 group-open:rotate-180 transition-transform">▼</span>
              </summary>
              <div class="px-5 pb-4 pt-1">
                <textarea rows="3" onchange="updateAnamnesis('${sec.key}', this.value)" placeholder="${sec.placeholder}" class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm outline-none focus:ring-2 focus:ring-indigo-500">${escapeHtml(p.anamnesis[sec.key] || '')}</textarea>
              </div>
            </details>
          `).join('')}
        </section>

        <!-- ESCALAS PSICOMÉTRICAS INTERATIVAS -->
        <section class="grid grid-cols-1 xl:grid-cols-2 gap-6">

          <!-- PHQ-9 -->
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
            <div class="flex items-center justify-between mb-3">
              <div>
                <h3 class="text-base font-bold">PHQ-9 — Depressão</h3>
                <p class="text-[11px] text-slate-500">0: Nenhuma vez | 1: Vários dias | 2: Mais da metade | 3: Quase todos os dias</p>
              </div>
              <div class="text-right">
                <span class="text-xl font-extrabold">${totals.phq9}</span><span class="text-xs text-slate-400">/27</span>
                <div class="text-[11px] font-bold text-${phqCls.color}-600 dark:text-${phqCls.color}-400">${phqCls.label}</div>
              </div>
            </div>

                      <button onclick="setScaleVal('phq9', ${i}, ${v})" class="w-8 h-7 rounded-lg text-xs font-bold transition ${p.scales.phq9[i] === v ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 hover:border-indigo-400'}">${v}</button>
                    `).join('')}

          <!-- GAD-7 & ISI -->
          <div class="space-y-6">

            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
              <div class="flex items-center justify-between mb-3">
                <div>
                  <h3 class="text-base font-bold">GAD-7 — Ansiedade</h3>

                <div class="text-right">
                  <span class="text-xl font-extrabold">${totals.gad7}</span><span class="text-xs text-slate-400">/21</span>
                  <div class="text-[11px] font-bold text-${gadCls.color}-600 dark:text-${gadCls.color}-400">${gadCls.label}</div>
                </div>
              </div>
              <div class="space-y-2">
                ${GAD7_QUESTIONS.map((q, i) => `
                  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/60">
                    <span class="text-xs font-medium">${i + 1}. ${q}</span>
                    <div class="flex gap-1 shrink-0">
                      ${[0, 1, 2, 3].map(v => `
                        <button onclick="setScaleVal('gad7', ${i}, ${v})" class="w-8 h-7 rounded-lg text-xs font-bold transition ${p.scales.gad7[i] === v ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 hover:border-indigo-400'}">${v}</button>
                      `).join('')}
                    </div>
                  </div>

            </div>

            <!-- ISI -->
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
              <div class="flex items-center justify-between mb-3">
                <div>
                  <h3 class="text-base font-bold">ISI — Índice de Gravidade de Insônia</h3>
                  <p class="text-[11px] text-slate-500">0: Nenhuma | 1: Leve | 2: Moderada | 3: Grave | 4: Muito Grave</p>
                </div>
                <div class="text-right">
                  <span class="text-xl font-extrabold">${totals.isi}</span><span class="text-xs text-slate-400">/28</span>
                  <div class="text-[11px] font-bold text-${isiCls.color}-600 dark:text-${isiCls.color}-400">${isiCls.label}</div>
                </div>
              </div>
              <div class="space-y-2">
                ${ISI_QUESTIONS.map((q, i) => `
                  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/60">
                    <span class="text-xs font-medium">${i + 1}. ${q}</span>
                    <div class="flex gap-1 shrink-0">
                      ${[0, 1, 2, 3, 4].map(v => `
                        <button onclick="setScaleVal('isi', ${i}, ${v})" class="w-7 h-7 rounded-lg text-xs font-bold transition ${p.scales.isi[i] === v ? 'bg-emerald-600 text-white shadow-sm' : 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 hover:border-emerald-400'}">${v}</button>
                      `).join('')}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </section>

        <!-- RASTREIO RÁPIDO: BIPOLARIDADE (MDQ) & TDAH (ASRS-6) -->
        <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- MDQ -->
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
            <div class="flex items-center justify-between mb-3">
              <div>
                <h3 class="text-base font-bold">Rastreio de Bipolaridade (MDQ Simplificado)</h3>
                <p class="text-[11px] text-slate-500">≥ 3 itens positivos sugere rastreio positivo para espectro bipolar.</p>
              </div>
              <span class="text-xs font-bold px-2.5 py-1 rounded-full ${totals.mdq >= 3 ? 'bg-rose-600 text-white' : 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400'}">
                ${totals.mdq}/5 — ${totals.mdq >= 3 ? 'RASTREIO POSITIVO' : 'Negativo'}
              </span>
            </div>
            <div class="space-y-2">
              ${MDQ_QUESTIONS.map((q, i) => `
                <label class="cursor-pointer flex items-start gap-2.5 p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                  <input type="checkbox" ${p.scales.mdq[i] ? 'checked' : ''} onchange="setMDQVal(${i}, this.checked)" class="mt-0.5 w-4 h-4 accent-rose-600 rounded" />
                  <span class="text-xs">${q}</span>
                </label>
              `).join('')}
            </div>
          </div>

          <!-- ASRS-6 -->
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
            <div class="flex items-center justify-between mb-3">
              <div>
                <h3 class="text-base font-bold">Rastreio de TDAH (ASRS-6)</h3>
                <p class="text-[11px] text-slate-500">0: Nunca | 1: Raramente | 2: Às vezes | 3: Freq. | 4: Muito Freq.</p>
              </div>
              <span class="text-xs font-bold px-2.5 py-1 rounded-full ${totals.asrsPos >= 4 ? 'bg-amber-500 text-slate-950' : 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400'}">
                ${totals.asrsPos}/6 críticos — ${totals.asrsPos >= 4 ? 'SUGESTIVO TDAH' : 'Baixo Risco'}
              </span>
            </div>
            <div class="space-y-2">
              ${ASRS_QUESTIONS.map((q, i) => `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/60">
                  <span class="text-xs">${i + 1}. ${q}</span>
                  <div class="flex gap-1 shrink-0">

                      <button onclick="setScaleVal('asrs', ${i}, ${v})" class="w-7 h-7 rounded-lg text-xs font-bold transition ${p.scales.asrs[i] === v ? 'bg-amber-500 text-slate-950 shadow-sm' : 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700'}">${v}</button>

                </div>
