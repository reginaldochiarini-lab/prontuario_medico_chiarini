            </div>
          </div>
        </section>
      `;
    }

    function updateAnamnesis(key, val) {
      const p = getActivePatient();
      p.anamnesis[key] = val;
      saveState();
    }

    function setScaleVal(scale, idx, val) {
      const p = getActivePatient();
      p.scales[scale][idx] = val;
      saveState();
      renderAll();
    }

    function setMDQVal(idx, checked) {
      const p = getActivePatient();
      p.scales.mdq[idx] = checked;
      saveState();
      renderAll();
    }

    function saveEvaluationToTimeline() {
      const p = getActivePatient();
      const totals = getScaleTotals(p);
      const bmi = calcBMI(p.weight, p.height);
      const today = new Date().toISOString().slice(0, 10);
      const medsSummary = p.therapy.allopathic.map(m => `${m.name} (${m.action})`).join(', ') || 'Manutenção clínica';
      const entry = {
        date: today,
        phq9: totals.phq9,
        gad7: totals.gad7,
        isi: totals.isi,
        weight: p.weight,
        bmi: parseFloat(bmi.val) || 0,
        summary: `Avaliação registrada. Conduta: ${medsSummary}.`
      };
      // Atualiza se já existir registro na mesma data ou adiciona novo
      const existingIdx = p.history.findIndex(h => h.date === today);
      if (existingIdx >= 0) p.history[existingIdx] = entry;
      else p.history.push(entry);
      saveState();
      showToast('Avaliação salva na linha do tempo longitudinal!');
    }

    /*************************************************************************
     * MÓDULO 3: EXAMES EM CAMADAS + CALCULADORAS (HOMA-IR & QTc BAZETT)
     *************************************************************************/
    function renderLabsModule(p) {
      const vals = p.labs.values || {};
      const homa = calcHOMAIR(vals.glucose, vals.insulin);
      const qtc = calcQTcBazett(vals.qt, vals.hr);

      const labFields = [
        { k: 'ferritin', label: 'Ferritina (ng/mL)', ref: 'Ótimo: ≥ 50' },
        { k: 'b12', label: 'Vitamina B12 (pg/mL)', ref: 'Ótimo: ≥ 500' },
        { k: 'vitD', label: 'Vitamina D 25-OH (ng/mL)', ref: 'Ótimo: 40–80' },
        { k: 'homocysteine', label: 'Homocisteína (µmol/L)', ref: 'Ótimo: ≤ 10' },
        { k: 'tsh', label: 'TSH (mUI/L)', ref: 'Ótimo: 0.5–2.5' },
        { k: 'hba1c', label: 'HbA1c (%)', ref: 'Ótimo: < 5.7%' },
        { k: 'tg', label: 'Triglicerídeos (mg/dL)', ref: 'Ótimo: < 150' },
        { k: 'pcr', label: 'PCR-us (mg/L)', ref: 'Ótimo: ≤ 1.0' }
      ];

      return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <h2 class="text-xl font-extrabold">Exames em Camadas — Psiquiatria Metabólica & Orgânica</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400">Selecione exames para o pedido médico e registre resultados com alertas de faixa ótima funcional.</p>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold px-3 py-1.5 rounded-xl bg-indigo-500/15 text-indigo-600 dark:text-indigo-300">
              ${p.labs.selectedExams.length} exame(s) selecionado(s)
            </span>
            <button onclick="switchTab('export')" class="px-3.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold shadow-sm transition">Ver Pedido →</button>
          </div>
        </div>

        <!-- 4 CAMADAS DE EXAMES -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
          ${EXAM_LAYERS.map(layer => {
            const allSelected = layer.exams.every(ex => p.labs.selectedExams.includes(ex));
            return `
              <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm flex flex-col justify-between">
                <div>
                  <div class="flex items-start justify-between gap-2 mb-3">
                    <div>
                      <h3 class="text-sm font-bold text-${layer.color}-600 dark:text-${layer.color}-400">${layer.title}</h3>
                      <p class="text-[11px] text-slate-500">${layer.subtitle}</p>
                    </div>
                    <button onclick="toggleExamLayer('${layer.id}')" class="shrink-0 text-[11px] font-semibold px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                      ${allSelected ? 'Desmarcar Camada' : 'Selecionar Camada'}
                    </button>
                  </div>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                    ${layer.exams.map(ex => {
                      const checked = p.labs.selectedExams.includes(ex);
                      return `
                        <label class="cursor-pointer flex items-center gap-2 p-2 rounded-xl text-xs transition ${checked ? 'bg-indigo-500/10 text-indigo-700 dark:text-indigo-300 font-semibold' : 'hover:bg-slate-50 dark:hover:bg-slate-800/60'}">
                          <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleSingleExam('${escapeHtml(ex)}', this.checked)" class="w-3.5 h-3.5 accent-indigo-600 rounded" />
                          <span>${ex}</span>
                        </label>
                      `;
                    }).join('')}
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <!-- CALCULADORAS INTEGRADA: HOMA-IR & QTc BAZETT -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- Calculadora HOMA-IR -->
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
            <h3 class="text-base font-bold mb-1 flex items-center gap-2">
              <span class="w-2 h-5 rounded-full bg-emerald-500"></span> Calculadora HOMA-IR (Resistência Insulínica)
            </h3>
            <p class="text-xs text-slate-500 mb-4">Fórmula: (Glicemia mg/dL × Insulina µU/mL) / 405. Alvo funcional: ≤ 2.5.</p>
            <div class="grid grid-cols-2 gap-3 mb-4">
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Glicemia Jejum (mg/dL)</label>
                <input type="number" step="0.1" value="${vals.glucose || ''}" oninput="updateLabVal('glucose', this.value)" placeholder="Ex: 95" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm outline-none focus:ring-2 focus:ring-emerald-500" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Insulina Jejum (µU/mL)</label>
                <input type="number" step="0.1" value="${vals.insulin || ''}" oninput="updateLabVal('insulin', this.value)" placeholder="Ex: 12" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm outline-none focus:ring-2 focus:ring-emerald-500" />
              </div>
            </div>
            <div class="p-3.5 rounded-xl ${!homa ? 'bg-slate-50 dark:bg-slate-800/60' : homa > 2.5 ? 'bg-rose-500/15 border border-rose-500/30' : 'bg-emerald-500/15 border border-emerald-500/30'} flex items-center justify-between">
              <div>
                <div class="text-xs font-semibold opacity-80">Resultado HOMA-IR</div>
                <div class="text-2xl font-extrabold">${homa ? homa.toFixed(2) : '--'}</div>
              </div>
              <div class="text-right text-xs font-bold">
                ${!homa ? '<span class="text-slate-400">Digite glicemia e insulina</span>' : homa > 2.5 ? '<span class="text-rose-600 dark:text-rose-400">⚠️ Resistência Insulínica (> 2.5)</span>' : '<span class="text-emerald-600 dark:text-emerald-400">✓ Sensibilidade Adequada</span>'}
              </div>
            </div>
          </div>

          <!-- Calculadora QTc Bazett -->
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
            <h3 class="text-base font-bold mb-1 flex items-center gap-2">
              <span class="w-2 h-5 rounded-full bg-rose-500"></span> Calculadora QTc (Fórmula de Bazett)
            </h3>
            <p class="text-xs text-slate-500 mb-4">QTc = QT / √RR. Alerta: > 450ms (H) / > 460ms (M) • Alto Risco Torsades: ≥ 500ms.</p>
            <div class="grid grid-cols-2 gap-3 mb-4">
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Intervalo QT medido (ms)</label>
                <input type="number" value="${vals.qt || ''}" oninput="updateLabVal('qt', this.value)" placeholder="Ex: 400" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm outline-none focus:ring-2 focus:ring-rose-500" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Frequência Cardíaca (bpm)</label>
                <input type="number" value="${vals.hr || ''}" oninput="updateLabVal('hr', this.value)" placeholder="Ex: 75" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm outline-none focus:ring-2 focus:ring-rose-500" />
              </div>
            </div>
            ${(() => {
              const limit = p.sex === 'F' ? 460 : 450;
              const statusCls = !qtc ? 'bg-slate-50 dark:bg-slate-800/60' : qtc >= 500 ? 'bg-rose-600 text-white' : qtc > limit ? 'bg-amber-500/15 border border-amber-500/40' : 'bg-emerald-500/15 border border-emerald-500/30';
              const msg = !qtc ? 'Digite QT e FC' : qtc >= 500 ? '🚨 ALTO RISCO (≥ 500ms)' : qtc > limit ? `⚠️ Prolongado (> ${limit}ms)` : '✓ QTc Normal';
              return `
                <div class="p-3.5 rounded-xl ${statusCls} flex items-center justify-between">
                  <div>
                    <div class="text-xs font-semibold opacity-80">QTc (Bazett)</div>
                    <div class="text-2xl font-extrabold">${qtc ? Math.round(qtc) + ' ms' : '--'}</div>
                  </div>
                  <div class="text-right text-xs font-bold">${msg}</div>
                </div>
              `;
            })()}
          </div>
        </div>

        <!-- REGISTRO DE RESULTADOS LABORATORIAIS (FAIXA ÓTIMA FUNCIONAL) -->
        <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
          <h3 class="text-base font-bold mb-1">Resultados Laboratoriais Atuais (Alvos Ótimos Funcionais)</h3>
          <p class="text-xs text-slate-500 mb-4">Valores fora da faixa ótima funcional para neuroquímica e metabolismo são destacados automaticamente.</p>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
            ${labFields.map(f => {
              const st = getFunctionalLabStatus(f.k, vals[f.k]);
              const borderCls = st?.status === 'alert' ? 'border-amber-500 ring-1 ring-amber-500/40 bg-amber-500/5' : st?.status === 'ok' ? 'border-emerald-500/50 bg-emerald-500/5' : 'border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50';
              return `
                <div class="p-3 rounded-xl border ${borderCls} transition">
                  <div class="flex items-center justify-between mb-1">
                    <label class="text-xs font-bold">${f.label}</label>
                    <span class="text-[10px] text-slate-400">${f.ref}</span>
                  </div>
                  <input type="number" step="0.1" value="${vals[f.k] || ''}" onchange="updateLabVal('${f.k}', this.value)" placeholder="Valor..." class="w-full px-2.5 py-1.5 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm outline-none" />
                  ${st ? `<div class="mt-1.5 text-[11px] font-semibold ${st.status === 'alert' ? 'text-amber-600 dark:text-amber-400' : 'text-emerald-600 dark:text-emerald-400'}">${st.status === 'alert' ? '⚠️ ' : '✓ '}${st.msg}</div>` : ''}
                </div>
              `;
            }).join('')}
          </div>
        </section>
      `;
    }

    function toggleExamLayer(layerId) {
      const p = getActivePatient();
      const layer = EXAM_LAYERS.find(l => l.id === layerId);
      if (!layer) return;
      const allSelected = layer.exams.every(ex => p.labs.selectedExams.includes(ex));
      if (allSelected) {
        p.labs.selectedExams = p.labs.selectedExams.filter(ex => !layer.exams.includes(ex));
      } else {
        layer.exams.forEach(ex => {
          if (!p.labs.selectedExams.includes(ex)) p.labs.selectedExams.push(ex);
        });
      }
      saveState();
      renderAll();
    }

    function toggleSingleExam(examName, checked) {
      const p = getActivePatient();
      if (checked && !p.labs.selectedExams.includes(examName)) {
        p.labs.selectedExams.push(examName);
      } else if (!checked) {
        p.labs.selectedExams = p.labs.selectedExams.filter(e => e !== examName);
      }
      saveState();
      renderAll();
    }

    function updateLabVal(key, value) {
      const p = getActivePatient();
      if (!p.labs.values) p.labs.values = {};
      p.labs.values[key] = value;
      saveState();
      renderAll();
    }

    /*************************************************************************
     * MÓDULO 4: DECISÃO TERAPÊUTICA (ALOPATIA, TAPERING & INTEGRATIVA)
     *************************************************************************/
    function renderTherapyModule(p) {
      return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <h2 class="text-xl font-extrabold">Decisão Terapêutica — Alopatia, Tapering & Integrativa</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400">Construa a prescrição estruturada integrando farmacologia alopática, desmame seguro e manipulação neuroprotetora.</p>
          </div>
        </div>

        <!-- Sub-abas do Módulo Terapêutico -->
        <div class="flex flex-wrap gap-2 p-1.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl w-fit">
          <button onclick="setTherapySubTab('allopathic')" class="px-4 py-2 rounded-xl text-xs font-bold transition ${therapySubTab === 'allopathic' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
            A. Manejo Alopático (${p.therapy.allopathic.length})
          </button>
          <button onclick="setTherapySubTab('tapering')" class="px-4 py-2 rounded-xl text-xs font-bold transition ${therapySubTab === 'tapering' ? 'bg-amber-500 text-slate-950 shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
            B. Cross-Tapering & Desmame
          </button>
          <button onclick="setTherapySubTab('integrative')" class="px-4 py-2 rounded-xl text-xs font-bold transition ${therapySubTab === 'integrative' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
            C. Psiquiatria Integrativa (${p.therapy.integrative.length})
          </button>
        </div>

        ${therapySubTab === 'allopathic' ? renderAllopathicSubTab(p) : therapySubTab === 'tapering' ? renderTaperingSubTab(p) : renderIntegrativeSubTab(p)}
      `;
    }

    function setTherapySubTab(sub) {
      therapySubTab = sub;
      renderAll();
    }

    // Sub-aba A: Alopatia

    function generateTaperingSchedule() {
      const p = getActivePatient();
      const strategy = document.getElementById('tp-strategy').value;
      const currentDrug = document.getElementById('tp-current-drug').value.trim() || 'Fármaco Atual';
      const currentDose = parseFloat(document.getElementById('tp-current-dose').value) || 10;
      const rate = parseFloat(document.getElementById('tp-rate').value) || 25;
      const intervalDays = parseInt(document.getElementById('tp-interval').value) || 14;
      const newDrug = document.getElementById('tp-new-drug')?.value.trim() || '';
      const newTargetDose = parseFloat(document.getElementById('tp-new-dose')?.value) || 0;

      const weeksPerStep = Math.max(1, Math.round(intervalDays / 7));
      const lines = [];

      if (strategy === 'cross_taper') {
        lines.push(`CRONOGRAMA DE TROCA CRUZADA (CROSS-TAPERING): ${currentDrug} (${currentDose}mg) → ${newDrug} (Alvo: ${newTargetDose}mg)`);
      } else {
        lines.push(`CRONOGRAMA DE DESMAME GUIADO — ${currentDrug} (Dose inicial: ${currentDose}mg | Redução: ${rate}% a cada ${intervalDays} dias)`);
      }

      let step = 1;
      let dose = currentDose;
      const isHyperbolic = rate === 10;
      const linearStepAmount = currentDose * (rate / 100);
      const maxSteps = isHyperbolic ? 8 : Math.ceil(100 / rate);

      for (let i = 1; i <= maxSteps; i++) {
        if (isHyperbolic) {
          dose = Number((dose * (1 - rate / 100)).toFixed(2));
        } else {
          dose = Number(Math.max(0, currentDose - linearStepAmount * i).toFixed(2));
        }
        const wStart = (i - 1) * weeksPerStep + 1;
        const wEnd = i * weeksPerStep;
        const period = weeksPerStep === 1 ? `Semana ${wStart}` : `Semanas ${wStart}–${wEnd}`;

        if (strategy === 'cross_taper' && newDrug && newTargetDose > 0) {
          const progress = Math.min(1, i / maxSteps);
          const newDoseStep = Number((newTargetDose * progress).toFixed(1));
          if (dose <= 0.05) {
            lines.push(`• ${period}: SUSPENDER ${currentDrug} | Manter ${newDrug} ${newTargetDose}mg/dia.`);
            break;
          } else {
            lines.push(`• ${period}: Reduzir ${currentDrug} para ${dose}mg + Associar ${newDrug} ${newDoseStep}mg.`);
          }
        } else {
          if (dose <= 0.05) {
            lines.push(`• ${period}: SUSPENDER ${currentDrug} se paciente assintomático e estável.`);
            break;
          } else {
            lines.push(`• ${period}: Reduzir ${currentDrug} para ${dose}mg.`);
          }
        }
        step++;
      }

      if (isHyperbolic && dose > 0.05) {
        lines.push(`• Próximos passos (fase final hiperbólica): Reduzir em degraus ainda menores (ex: gotas ou manipulação fracionada) a cada ${intervalDays} dias até suspensão completa.`);
      }
      lines.push(`*Orientação de segurança: Caso surjam sintomas de descontinuação (tontura, insônia rebote, ansiedade intensa ou "brain zaps"), manter a dose atual por mais 7–14 dias antes de avançar ao próximo degrau.`);

      const scheduleText = lines.join('\n');
      p.therapy.tapering = { currentDrug, currentDose, unit: 'mg', strategy, newDrug, newTargetDose, rate, intervalDays, scheduleText };
      saveState();
      renderAll();
      showToast('Cronograma gerado com sucesso!');
    }

     * MÓDULO 5: ACOMPANHAMENTO LONGITUDINAL (GRÁFICO SVG + TIMELINE)
     *************************************************************************/
    function renderLongitudinalModule(p) {
      const hist = [...(p.history || [])].sort((a, b) => a.date.localeCompare(b.date));

      return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <h2 class="text-xl font-extrabold">Acompanhamento Longitudinal</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400">Evolução comparativa de PHQ-9, GAD-7, ISI e parâmetros antropométricos ao longo das consultas.</p>
          </div>
          <button onclick="saveEvaluationToTimeline(); renderAll();" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-sm transition self-start sm:self-auto">
            + Registrar Consulta de Hoje
          </button>
        </div>

        <!-- Gráfico SVG Interativo -->
        <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
            <h3 class="text-base font-bold">Curva de Evolução Psicométrica</h3>
            <div class="flex items-center gap-4 text-xs font-semibold">
              <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-indigo-500"></span> PHQ-9 (0–27)</span>
              <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-amber-500"></span> GAD-7 (0–21)</span>
              <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-emerald-500"></span> ISI (0–28)</span>
            </div>
          </div>

          ${hist.length === 0 ? `
            <div class="py-12 text-center text-xs text-slate-400">
              Nenhuma avaliação registrada na linha do tempo ainda. Clique em "+ Registrar Consulta de Hoje".
            </div>
          ` : renderLongitudinalSVG(hist)}
        </section>

        <!-- Linha do Tempo das Consultas -->
        <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
          <h3 class="text-base font-bold mb-4">Histórico de Consultas (${hist.length})</h3>
          ${hist.length === 0 ? '<p class="text-xs text-slate-400">Sem registros.</p>' : `
            <div class="space-y-3">
              ${[...hist].reverse().map((h, revIdx) => {
                const origIdx = p.history.findIndex(item => item.date === h.date && item.summary === h.summary);
                return `
                  <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/70 flex flex-col md:flex-row md:items-center justify-between gap-3">
                    <div class="space-y-1">
                      <div class="flex items-center gap-2 flex-wrap">
                        <span class="text-xs font-extrabold px-2.5 py-0.5 rounded-lg bg-indigo-600 text-white">${formatDateBR(h.date)}</span>
                        <span class="text-xs font-semibold px-2 py-0.5 rounded-md bg-indigo-500/15 text-indigo-600 dark:text-indigo-300">PHQ-9: ${h.phq9}</span>
                        <span class="text-xs font-semibold px-2 py-0.5 rounded-md bg-amber-500/15 text-amber-600 dark:text-amber-300">GAD-7: ${h.gad7}</span>
                        <span class="text-xs font-semibold px-2 py-0.5 rounded-md bg-emerald-500/15 text-emerald-600 dark:text-emerald-300">ISI: ${h.isi}</span>
                        <span class="text-xs text-slate-500">Peso: ${h.weight}kg (IMC ${h.bmi})</span>
                      </div>
                      <p class="text-xs text-slate-600 dark:text-slate-300">${escapeHtml(h.summary)}</p>
                    </div>
                    <button onclick="deleteHistoryEntry(${origIdx})" class="self-end md:self-center text-xs text-slate-400 hover:text-rose-500 font-semibold">Excluir</button>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </section>
      `;
    }

    function renderLongitudinalSVG(hist) {
      const W = 760, H = 260, padL = 42, padR = 24, padT = 20, padB = 38;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;
      const maxY = 28;

      const xPos = (i) => hist.length === 1 ? padL + plotW / 2 : padL + (i / (hist.length - 1)) * plotW;
      const yPos = (val) => padT + plotH - (Math.min(maxY, Math.max(0, val)) / maxY) * plotH;

      const makePath = (key) => hist.map((h, i) => `${i === 0 ? 'M' : 'L'} ${xPos(i).toFixed(1)} ${yPos(h[key]).toFixed(1)}`).join(' ');

      const gridLines = [0, 7, 14, 21, 28].map(val => {
        const y = yPos(val);
        return `
          <line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="currentColor" stroke-opacity="0.12" stroke-dasharray="4 4" />
          <text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="currentColor" opacity="0.55">${val}</text>
        `;
      }).join('');

      const series = [
        { key: 'phq9', color: '#6366f1', label: 'PHQ-9' },
        { key: 'gad7', color: '#f59e0b', label: 'GAD-7' },
        { key: 'isi',  color: '#10b981', label: 'ISI' }
      ];

      return `
        <div class="w-full overflow-x-auto">
          <svg viewBox="0 0 ${W} ${H}" class="w-full min-w-[480px] h-auto select-none">
            ${gridLines}
            ${series.map(s => `
              ${hist.length > 1 ? `<path d="${makePath(s.key)}" fill="none" stroke="${s.color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />` : ''}
              ${hist.map((h, i) => `
                <g class="cursor-pointer">
                  <circle cx="${xPos(i)}" cy="${yPos(h[s.key])}" r="5.5" fill="${s.color}" stroke="#ffffff" stroke-width="2">
                    <title>${formatDateBR(h.date)} — ${s.label}: ${h[s.key]}</title>
                  </circle>
                  <text x="${xPos(i)}" y="${yPos(h[s.key]) - 10}" text-anchor="middle" font-size="10" font-weight="700" fill="${s.color}">${h[s.key]}</text>
                </g>
              `).join('')}
            `).join('')}
            ${hist.map((h, i) => `
              <text x="${xPos(i)}" y="${H - 12}" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.65">${formatDateBR(h.date)}</text>
            `).join('')}
          </svg>
        </div>
      `;
    }

    function deleteHistoryEntry(idx) {
      const p = getActivePatient();
      if (idx >= 0) {
        p.history.splice(idx, 1);
        saveState();
        renderAll();
        showToast('Registro removido da linha do tempo.');
      }
    }

    /*************************************************************************
     * MÓDULO 6: CENTRAL DE EXPORTAÇÃO (AMPLIMED / MEMED / PACIENTE)
     *************************************************************************/
    function buildExportBlocks(p) {
      const todayBR = formatDateBR(new Date().toISOString().slice(0, 10));
      const bmi = calcBMI(p.weight, p.height);
      const totals = getScaleTotals(p);
      const alerts = computeClinicalAlerts(p);
      const homa = calcHOMAIR(p.labs?.values?.glucose, p.labs?.values?.insulin);
      const qtc = calcQTcBazett(p.labs?.values?.qt, p.labs?.values?.hr);

      // Exames alterados
      const alteredLabs = [];
      const vals = p.labs?.values || {};
      Object.keys(vals).forEach(k => {
        const st = getFunctionalLabStatus(k, vals[k]);
        if (st && st.status === 'alert') alteredLabs.push(`${k.toUpperCase()}: ${vals[k]} (${st.msg})`);
      });
      if (homa && homa > 2.5) alteredLabs.push(`HOMA-IR: ${homa.toFixed(2)} (Resistência Insulínica)`);
      if (qtc && qtc > (p.sex === 'F' ? 460 : 450)) alteredLabs.push(`QTc Bazett: ${Math.round(qtc)}ms (Prolongado)`);

      // 1. Evolução Prontuário (Amplimed)
      const evolucao = [
        `EVOLUÇÃO PSIQUIÁTRICA INTEGRATIVA — ${todayBR}`,
        `Paciente: ${p.name} | ${p.age} anos | Sexo: ${p.sex} | Peso: ${p.weight}kg | Altura: ${p.height}cm | IMC: ${bmi.val} (${bmi.label})`,
        `Hipóteses Diagnósticas: ${p.diagnoses}`,
        `Psicofármacos em uso prévio/atual: ${p.currentMeds.join(', ') || 'Nenhum'}`,
        ``,
        `[ANAMNESE]`,
        `• HDA: ${p.anamnesis.qpHda || 'Não preenchido'}`,
        `• Histórico de Psicofármacos: ${p.anamnesis.prevMeds || 'Não preenchido'}`,
        `• Sono & Ritmo Circadiano: ${p.anamnesis.sleepCircadian || 'Não preenchido'}`,
        `• Eixo Intestino-Cérebro: ${p.anamnesis.gutBrain || 'Não preenchido'}`,
        `• Estresse & Hábitos: ${p.anamnesis.stressHabits || 'Não preenchido'}`,
        ``,
        `[ESCALAS PSICOMÉTRICAS]`,
        `• PHQ-9: ${totals.phq9}/27 (${classifyPHQ9(totals.phq9).label}) | GAD-7: ${totals.gad7}/21 (${classifyGAD7(totals.gad7).label}) | ISI: ${totals.isi}/28 (${classifyISI(totals.isi).label})`,
        `• Rastreio Bipolaridade (MDQ): ${totals.mdq}/5 (${totals.mdq >= 3 ? 'POSITIVO' : 'Negativo'}) | Rastreio TDAH (ASRS-6): ${totals.asrsPos}/6 itens críticos`,
        ``,
        `[EXAMES & ALERTAS CLÍNICOS]`,
        `• Achados fora da faixa ótima funcional: ${alteredLabs.length ? alteredLabs.join('; ') : 'Nenhum registrado'}`,
        `• Alertas de Segurança Farmacológica: ${alerts.length ? alerts.map(a => a.title).join(' | ') : 'Sem alertas críticos'}`,
        ``,
        `[CONDUTA TERAPÊUTICA]`,
        `• Alopatia: ${p.therapy.allopathic.map(m => `${m.name} ${m.dose} [${m.action}]`).join('; ') || 'Sem alterações'}`,
        `• Integrativa/Manipulação: ${p.therapy.integrative.map(f => f.title).join('; ') || 'Nenhuma'}`,
        `• Exames solicitados: ${p.labs.selectedExams.length} exame(s).`
      ].join('\n');

      // 2. BLOCO 1 — Prescrição Estruturada (Memed / Receituário)
      const aloLines = p.therapy.allopathic.length
        ? p.therapy.allopathic.map((m, i) => `${i + 1}. ${m.name} ${m.dose} — [${m.action.toUpperCase()}]\n   Posologia: ${m.posology}`).join('\n')
        : 'Nenhuma medicação alopática adicionada.';

      const taperBlock = p.therapy.tapering?.scheduleText
        ? `\n\n--- ESQUEMA DE DESMAME / CROSS-TAPERING ---\n${p.therapy.tapering.scheduleText}`
        : '';

      const intLines = p.therapy.integrative.length
        ? p.therapy.integrative.map((f, i) => {
            const activesFmt = f.actives.map(a => `${a.name} ----- ${a.dose}`).join('\n');
            return `FÓRMULA ${i + 1}: ${f.title.toUpperCase()} (${f.turno})\n${activesFmt}\nModo de uso: ${f.posology}`;
          }).join('\n\n')
        : 'Nenhuma fórmula manipulada adicionada.';

      const prescricao = [
        `=== A. MANEJO ALOPÁTICO (DROGARIA) ===`,
        aloLines + taperBlock,
        ``,
        `=== B. SUPORTE INTEGRATIVO (MANIPULAÇÃO) ===`,
        intLines
      ].join('\n');

      // 3. BLOCO 2 — Solicitação de Exames
      const exames = p.labs.selectedExams.length
        ? `SOLICITAÇÃO DE EXAMES LABORATORIAIS E COMPLEMENTARES\nPaciente: ${p.name} | Data: ${todayBR}\n\n` + p.labs.selectedExams.map(e => `• ${e}`).join('\n')
        : 'Nenhum exame selecionado no módulo Exames em Camadas.';

      // 4. BLOCO 3 — Orientações ao Paciente
      const selectedOris = ORIENTATION_PRESETS.filter(o => (p.orientations || []).includes(o.id));
      const orientacoes = [
        `ORIENTAÇÕES AO PACIENTE — ${p.name}`,
        `Data: ${todayBR}`,
        ``,
        ...(selectedOris.length ? selectedOris.map(o => o.text) : ['Selecione os itens de orientação no checklist acima.'])
      ].join('\n\n');

      return { evolucao, prescricao, exames, orientacoes };
    }

    function renderExportModule(p) {
      const blocks = buildExportBlocks(p);

      return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <h2 class="text-xl font-extrabold">Central de Exportação (Amplimed / Memed / Paciente)</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400">Textos limpos, estruturados e editáveis prontos para colar no prontuário ou imprimir em PDF.</p>
          </div>
          <button onclick="printExportBlocks()" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-sm transition flex items-center gap-2 self-start sm:self-auto">
            🖨️ Imprimir / Salvar PDF
          </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- Evolução Amplimed -->
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm flex flex-col">
            <div class="flex items-center justify-between mb-3">
              <div>
                <h3 class="text-sm font-bold text-indigo-600 dark:text-indigo-400">EVOLUÇÃO ESTRUTURADA (AMPLIMED)</h3>
                <p class="text-[11px] text-slate-500">Resumo clínico, escalas, exames alterados e conduta</p>
              </div>
              <button onclick="copyTextToClipboard(document.getElementById('exp-evolucao').value, this)" class="text-xs font-bold px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-indigo-600 hover:text-white transition">Copiar Bloco</button>
            </div>
            <textarea id="exp-evolucao" rows="13" class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-mono leading-relaxed outline-none focus:ring-2 focus:ring-indigo-500">${escapeHtml(blocks.evolucao)}</textarea>
          </div>

          <!-- BLOCO 1: Prescrição Memed -->
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm flex flex-col">
            <div class="flex items-center justify-between mb-3">
              <div>
                <h3 class="text-sm font-bold text-emerald-600 dark:text-emerald-400">BLOCO 1 — PRESCRIÇÃO (MEMED / RECEITUÁRIO)</h3>
                <p class="text-[11px] text-slate-500">Alopatia (Drogaria) + Tapering + Manipulação Integrativa</p>
              </div>
              <button onclick="copyTextToClipboard(document.getElementById('exp-prescricao').value, this)" class="text-xs font-bold px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-emerald-600 hover:text-white transition">Copiar Bloco</button>
            </div>
            <textarea id="exp-prescricao" rows="13" class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-mono leading-relaxed outline-none focus:ring-2 focus:ring-emerald-500">${escapeHtml(blocks.prescricao)}</textarea>
          </div>

          <!-- BLOCO 2: Solicitação de Exames -->
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm flex flex-col">
            <div class="flex items-center justify-between mb-3">
              <div>
                <h3 class="text-sm font-bold text-amber-600 dark:text-amber-400">BLOCO 2 — SOLICITAÇÃO DE EXAMES</h3>
                <p class="text-[11px] text-slate-500">${p.labs.selectedExams.length} exame(s) selecionado(s) nas camadas</p>
              </div>
              <button onclick="copyTextToClipboard(document.getElementById('exp-exames').value, this)" class="text-xs font-bold px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-amber-500 hover:text-slate-950 transition">Copiar Bloco</button>
            </div>
            <textarea id="exp-exames" rows="11" class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-mono leading-relaxed outline-none focus:ring-2 focus:ring-amber-500">${escapeHtml(blocks.exames)}</textarea>
          </div>

          <!-- BLOCO 3: Orientações ao Paciente -->
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm flex flex-col space-y-3">
            <div class="flex items-center justify-between">
              <div>
                <h3 class="text-sm font-bold text-cyan-600 dark:text-cyan-400">BLOCO 3 — ORIENTAÇÕES AO PACIENTE</h3>
                <p class="text-[11px] text-slate-500">Marque os itens desejados para montar o texto automaticamente</p>
              </div>
              <button onclick="copyTextToClipboard(document.getElementById('exp-orientacoes').value, this)" class="text-xs font-bold px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-cyan-600 hover:text-white transition">Copiar Bloco</button>
            </div>
            <div class="flex flex-wrap gap-1.5">
              ${ORIENTATION_PRESETS.map(o => {
                const checked = (p.orientations || []).includes(o.id);
                return `
                  <label class="cursor-pointer text-[11px] font-semibold px-2.5 py-1 rounded-lg border transition ${checked ? 'bg-cyan-500/15 border-cyan-500 text-cyan-700 dark:text-cyan-300' : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-500'}">
                    <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleOrientation('${o.id}', this.checked)" class="hidden" />
                    ${checked ? '✓ ' : '+ '}${o.title}
                  </label>
                `;
              }).join('')}
            </div>
            <textarea id="exp-orientacoes" rows="8" class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-mono leading-relaxed outline-none focus:ring-2 focus:ring-cyan-500">${escapeHtml(blocks.orientacoes)}</textarea>
          </div>
        </div>
      `;
    }

    function toggleOrientation(id, checked) {
      const p = getActivePatient();
      if (!p.orientations) p.orientations = [];
      if (checked && !p.orientations.includes(id)) p.orientations.push(id);
      else if (!checked) p.orientations = p.orientations.filter(x => x !== id);
      saveState();
      renderAll();
    }

    function printExportBlocks() {
      const p = getActivePatient();
      const presc = document.getElementById('exp-prescricao')?.value || '';
      const exams = document.getElementById('exp-exames')?.value || '';
      const ori   = document.getElementById('exp-orientacoes')?.value || '';

      const printArea = document.getElementById('print-area');
      printArea.innerHTML = `
        <div style="font-family: Inter, sans-serif; color: #0f172a; max-width: 800px; margin: 0 auto;">
          <div style="border-bottom: 2px solid #4f46e5; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
            <div>
              <h1 style="font-size: 20px; font-weight: 800; margin: 0;">PsicoCare Alta Performance</h1>
              <p style="font-size: 12px; color: #475569; margin: 2px 0 0;">Psiquiatria Alopática & Integrativa</p>
            </div>
            <div style="text-align: right; font-size: 12px;">
              <strong>Paciente:</strong> ${escapeHtml(p.name)}<br/>
              <strong>Data:</strong> ${formatDateBR(new Date().toISOString().slice(0, 10))}
            </div>
          </div>
          <h2 style="font-size: 14px; font-weight: 700; color: #059669; margin-bottom: 6px;">PRESCRIÇÃO MÉDICA</h2>
          <pre style="white-space: pre-wrap; font-family: inherit; font-size: 12px; background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 20px;">${escapeHtml(presc)}</pre>

          <h2 style="font-size: 14px; font-weight: 700; color: #4f46e5; margin-bottom: 6px;">SOLICITAÇÃO DE EXAMES</h2>
          <pre style="white-space: pre-wrap; font-family: inherit; font-size: 12px; background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 20px;">${escapeHtml(exams)}</pre>

          <h2 style="font-size: 14px; font-weight: 700; color: #0891b2; margin-bottom: 6px;">ORIENTAÇÕES AO PACIENTE</h2>
          <pre style="white-space: pre-wrap; font-family: inherit; font-size: 12px; background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0;">${escapeHtml(ori)}</pre>
        </div>
      `;
      printArea.classList.remove('hidden');
      window.print();
      printArea.classList.add('hidden');
    }

    /*************************************************************************
     * UTILITÁRIOS E INICIALIZAÇÃO
     *************************************************************************/
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatDateBR(isoDate) {
      if (!isoDate) return '';
      const parts = isoDate.split('-');
      if (parts.length !== 3) return isoDate;
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      // Restaurar tema salvo
      const savedTheme = localStorage.getItem('psicocare_theme');
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
      updateThemeUI();

      // Carregar pacientes e renderizar
      loadState();
      renderAll();
    });
  </script>
